<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Patient Login – Sanjeevani Clinic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Plus Jakarta Sans',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;background:radial-gradient(ellipse 120% 80% at 60% 40%,#0e4f3a 0%,#072518 50%,#030f09 100%);padding:20px}
    .box{background:rgba(255,255,255,.04);border:1px solid rgba(39,201,122,.18);border-radius:20px;padding:40px 36px;width:100%;max-width:420px}
    .logo{text-align:center;margin-bottom:28px}
    .logomark{width:56px;height:56px;background:linear-gradient(140deg,#16a060,#0d9488);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
    .clinic-name{font-size:.85rem;font-weight:800;color:#fff}
    .clinic-sub{font-size:.7rem;color:rgba(255,255,255,.4);margin-top:2px}
    .tabs{border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:20px;display:flex;gap:4px}
    .tab-btn{padding:8px 16px;border:none;background:none;color:rgba(255,255,255,.4);font-weight:700;font-size:.82rem;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;font-family:inherit}
    .tab-btn.active{color:#27c97a;border-bottom-color:#27c97a}
    .tab-panel{display:none}.tab-panel.active{display:block}
    h1{font-size:1.2rem;font-weight:800;color:#fff;margin-bottom:6px}
    .role{font-size:.78rem;color:#27c97a;font-weight:600;margin-bottom:24px}
    .demo{background:rgba(39,201,122,.07);border:1px solid rgba(39,201,122,.15);border-radius:10px;padding:12px 14px;font-size:.75rem;color:rgba(255,255,255,.5);margin-bottom:18px;line-height:1.8}
    .demo code{color:rgba(255,255,255,.8);font-size:.78rem}
    .fill-btn{display:inline-block;margin-top:8px;background:rgba(39,201,122,.2);border:1px solid rgba(39,201,122,.4);color:#27c97a;border-radius:6px;padding:5px 14px;font-size:.78rem;font-weight:700;cursor:pointer;font-family:inherit}
    .fill-btn:hover{background:rgba(39,201,122,.35)}
    .err{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);border-radius:10px;padding:10px 14px;font-size:.8rem;color:#fca5a5;margin-bottom:14px;display:none}
    label{display:block;font-size:.78rem;font-weight:600;color:rgba(255,255,255,.6);margin-bottom:6px;margin-top:14px}
    input,select{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:11px 14px;color:#fff;font-size:.88rem;font-family:inherit;outline:none}
    input:focus,select:focus{border-color:rgba(39,201,122,.5);background:rgba(39,201,122,.05)}
    input::placeholder{color:rgba(255,255,255,.25)}
    select option{background:#072518;color:#fff}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .signin-btn{width:100%;margin-top:18px;padding:13px;background:linear-gradient(135deg,#16a060,#0d9488);border:none;border-radius:12px;color:#fff;font-size:.9rem;font-weight:700;font-family:inherit;cursor:pointer}
    .signin-btn:disabled{opacity:.6;cursor:not-allowed}
    .footer{text-align:center;margin-top:20px;font-size:.75rem;color:rgba(255,255,255,.3)}
    .footer a{color:#27c97a;text-decoration:none;margin:0 6px}
  </style>
</head>
<body>
<div class="box">
  <div class="logo">
    <div class="logomark">
      <svg width="30" height="30" viewBox="0 0 32 32" fill="none" stroke="white" stroke-width="1.4">
        <rect x="11" y="9.5" width="10" height="14.5" rx="3" fill="rgba(255,255,255,.18)"/>
        <line x1="16" y1="13" x2="16" y2="17.5" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="13.8" y1="15.2" x2="18.2" y2="15.2" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="clinic-name">Sanjeevani Clinic</div>
    <div class="clinic-sub">Multispeciality Homeopathy · Jagtial</div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab(this,'tab-login')">Sign In</button>
    <button class="tab-btn" onclick="switchTab(this,'tab-register')">New Patient</button>
  </div>

  <!-- Sign In -->
  <div id="tab-login" class="tab-panel active">
    <h1>Patient Login</h1>
    <div class="role">— Access your health portal</div>
    <div class="demo">
      <strong style="color:rgba(255,255,255,.7)">Demo:</strong> patient1@example.com / Patient@123<br>
      <button class="fill-btn" type="button" onclick="fillAndLogin()">&#9889; Fill &amp; Sign In</button>
    </div>
    <div class="err" id="loginErr"></div>
    <label>Email Address</label>
    <input type="email" id="l_email" placeholder="your@email.com" autocomplete="username"/>
    <label>Password</label>
    <input type="password" id="l_password" placeholder="••••••••" autocomplete="current-password"/>
    <button class="signin-btn" id="loginBtn" onclick="doLogin()">&#8594; Sign In</button>
  </div>

  <!-- Register -->
  <div id="tab-register" class="tab-panel">
    <h1>Create Account</h1>
    <div class="role">— New patient self-registration</div>
    <div class="err" id="regErr"></div>
    <label>Full Name *</label>
    <input id="rg_name" placeholder="Your full name"/>
    <label>Email *</label>
    <input type="email" id="rg_email" placeholder="your@email.com"/>
    <label>Phone *</label>
    <input id="rg_phone" placeholder="10-digit mobile"/>
    <div class="form-row">
      <div>
        <label>Date of Birth</label>
        <input type="date" id="rg_dob"/>
      </div>
      <div>
        <label>Gender</label>
        <select id="rg_gender">
          <option value="">Select</option>
          <option>Male</option><option>Female</option><option>Other</option>
        </select>
      </div>
    </div>
    <label>Password * (min 8 chars)</label>
    <input type="password" id="rg_password" placeholder="Create a strong password" minlength="8"/>
    <button class="signin-btn" id="regBtn" onclick="doRegister()">Create Account</button>
  </div>

  <div class="footer">
    <a href="../index.html">← Back to website</a>
    <a href="tel:+919912322251">&#128222; 9912322251</a>
  </div>
</div>

<script>
function switchTab(btn, panelId) {
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  document.querySelectorAll('.tab-panel').forEach(function(p){ p.classList.remove('active'); });
  document.getElementById(panelId).classList.add('active');
}

function showErr(id, msg) {
  var e = document.getElementById(id);
  e.textContent = msg; e.style.display = 'block';
}
function hideErr(id) {
  document.getElementById(id).style.display = 'none';
}

function fillAndLogin() {
  document.getElementById('l_email').value = 'patient1@example.com';
  document.getElementById('l_password').value = 'Patient@123';
  doLogin();
}

async function doLogin() {
  hideErr('loginErr');
  var email = document.getElementById('l_email').value.trim();
  var password = document.getElementById('l_password').value;
  if (!email || !password) { showErr('loginErr','Please enter email and password.'); return; }
  var btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    var res = await fetch('/api/auth/login', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, password: password })
    });
    var data = await res.json();
    if (!res.ok) { showErr('loginErr', data.error || 'Login failed.'); return; }
    if (data.user.role !== 'patient') { showErr('loginErr','This portal is for patients only.'); return; }
    localStorage.setItem('sj_user', JSON.stringify(data.user));
    btn.textContent = '✓ Logged in! Loading…';
    window.location.replace('/patient/dashboard.html');
  } catch(e) {
    showErr('loginErr', 'Error: ' + (e.message || 'Cannot reach server.'));
    btn.disabled = false;
    btn.textContent = '→ Sign In';
  }
}

async function doRegister() {
  hideErr('regErr');
  var name = document.getElementById('rg_name').value.trim();
  var email = document.getElementById('rg_email').value.trim();
  var phone = document.getElementById('rg_phone').value.trim();
  var password = document.getElementById('rg_password').value;
  if (!name || !email || !phone || !password) { showErr('regErr','Name, email, phone and password are required.'); return; }
  if (password.length < 8) { showErr('regErr','Password must be at least 8 characters.'); return; }
  var btn = document.getElementById('regBtn');
  btn.disabled = true; btn.textContent = 'Creating…';
  try {
    var res = await fetch('/api/auth/register', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: name, email: email, phone: phone, password: password,
        dob: document.getElementById('rg_dob').value,
        gender: document.getElementById('rg_gender').value
      })
    });
    var data = await res.json();
    if (!res.ok) { showErr('regErr', data.error || 'Registration failed.'); return; }
    window.location.href = '/patient/dashboard.html';
  } catch(e) {
    showErr('regErr','Cannot reach server. Please try again.');
  } finally {
    btn.disabled = false; btn.textContent = 'Create Account';
  }
}
</script>
</body>
</html>
