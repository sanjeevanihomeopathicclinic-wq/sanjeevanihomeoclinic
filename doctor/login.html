<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Doctor Login – Sanjeevani Clinic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Plus Jakarta Sans',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;background:radial-gradient(ellipse 120% 80% at 60% 40%,#0e4f3a 0%,#072518 50%,#030f09 100%);padding:20px}
    .box{background:rgba(255,255,255,.04);border:1px solid rgba(39,201,122,.18);border-radius:20px;padding:40px 36px;width:100%;max-width:400px}
    .logo{text-align:center;margin-bottom:28px}
    .logomark{width:56px;height:56px;background:linear-gradient(140deg,#16a060,#0d9488);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
    .clinic-name{font-size:.85rem;font-weight:800;color:#fff}
    .clinic-sub{font-size:.7rem;color:rgba(255,255,255,.4);margin-top:2px}
    h1{font-size:1.2rem;font-weight:800;color:#fff;margin-bottom:6px}
    .role{font-size:.78rem;color:#27c97a;font-weight:600;margin-bottom:24px}
    .demo{background:rgba(39,201,122,.07);border:1px solid rgba(39,201,122,.15);border-radius:10px;padding:12px 14px;font-size:.75rem;color:rgba(255,255,255,.5);margin-bottom:18px;line-height:1.8}
    .demo code{color:rgba(255,255,255,.8);font-size:.78rem}
    .fill-btn{display:inline-block;margin-top:8px;background:rgba(39,201,122,.2);border:1px solid rgba(39,201,122,.4);color:#27c97a;border-radius:6px;padding:5px 14px;font-size:.78rem;font-weight:700;cursor:pointer;font-family:inherit}
    .fill-btn:hover{background:rgba(39,201,122,.35)}
    .err{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);border-radius:10px;padding:10px 14px;font-size:.8rem;color:#fca5a5;margin-bottom:14px;display:none}
    label{display:block;font-size:.78rem;font-weight:600;color:rgba(255,255,255,.6);margin-bottom:6px;margin-top:14px}
    input{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:11px 14px;color:#fff;font-size:.88rem;font-family:inherit;outline:none}
    input:focus{border-color:rgba(39,201,122,.5);background:rgba(39,201,122,.05)}
    input::placeholder{color:rgba(255,255,255,.25)}
    .signin-btn{width:100%;margin-top:18px;padding:13px;background:linear-gradient(135deg,#16a060,#0d9488);border:none;border-radius:12px;color:#fff;font-size:.9rem;font-weight:700;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
    .signin-btn:disabled{opacity:.6;cursor:not-allowed}
    .signin-btn:hover:not(:disabled){opacity:.9}
    .footer{text-align:center;margin-top:20px;font-size:.75rem;color:rgba(255,255,255,.3)}
    .footer a{color:#27c97a;text-decoration:none}
  </style>
</head>
<body>
<div class="box">
  <div class="logo">
    <div class="logomark">
      <svg width="30" height="30" viewBox="0 0 32 32" fill="none" stroke="white" stroke-width="1.4">
        <rect x="11" y="9.5" width="10" height="14.5" rx="3" fill="rgba(255,255,255,.18)"/>
        <line x1="16" y1="13" x2="16" y2="17.5" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="13.8" y1="15.2" x2="18.2" y2="15.2" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="clinic-name">Sanjeevani Clinic</div>
    <div class="clinic-sub">Multispeciality Homeopathy · Jagtial</div>
  </div>

  <h1>Doctor Login</h1>
  <div class="role">— Dr. T. Srinivas, MD (Homeopathy)</div>

  <div class="demo">
    <strong style="color:rgba(255,255,255,.7)">Demo credentials</strong><br>
    Email: <code>doctor@sanjeevani.clinic</code><br>
    Password: <code>Doctor@123</code><br>
    <button class="fill-btn" type="button" onclick="fillAndLogin()">&#9889; Fill &amp; Sign In</button>
  </div>

  <div class="err" id="err"></div>

  <label>Email Address</label>
  <input type="email" id="email" placeholder="doctor@sanjeevani.clinic" autocomplete="username"/>

  <label>Password</label>
  <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"/>

  <button class="signin-btn" id="btn" onclick="doLogin()">
    &#8594; Sign In
  </button>

  <div class="footer"><a href="../index.html">← Back to website</a></div>
</div>

<script>
function showErr(msg) {
  var e = document.getElementById('err');
  e.textContent = msg;
  e.style.display = 'block';
}
function hideErr() {
  document.getElementById('err').style.display = 'none';
}

function fillAndLogin() {
  document.getElementById('email').value = 'doctor@sanjeevani.clinic';
  document.getElementById('password').value = 'Doctor@123';
  doLogin();
}

async function doLogin() {
  hideErr();
  var email = document.getElementById('email').value.trim();
  var password = document.getElementById('password').value;
  if (!email || !password) { showErr('Please enter email and password.'); return; }
  var btn = document.getElementById('btn');
  btn.disabled = true;
  btn.textContent = 'Signing in…';
  try {
    var res = await fetch('/api/auth/login', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, password: password })
    });
    var data = await res.json();
    if (!res.ok) { showErr(data.error || 'Login failed.'); return; }
    if (data.user.role !== 'doctor') { showErr('This portal is for doctors only.'); return; }
    localStorage.setItem('sj_user', JSON.stringify(data.user));
    btn.textContent = '✓ Logged in! Loading…';
    window.location.replace('/doctor/dashboard.html');
  } catch(e) {
    showErr('Error: ' + (e.message || 'Cannot reach server.'));
    btn.disabled = false;
    btn.textContent = '→ Sign In';
  }
}

// Allow Enter key
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
