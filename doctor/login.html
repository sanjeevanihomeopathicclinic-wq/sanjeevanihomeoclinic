<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Doctor Login – Sanjeevani Clinic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../cms/css/dashboard.css"/>
  <style>
    body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:radial-gradient(ellipse 120% 80% at 60% 40%,#0e4f3a 0%,#072518 50%,#030f09 100%)}
    .login-box{background:rgba(255,255,255,.04);border:1px solid rgba(39,201,122,.18);border-radius:20px;padding:40px 36px;width:100%;max-width:400px}
    .login-logo{text-align:center;margin-bottom:28px}
    .login-logo-mark{width:56px;height:56px;background:linear-gradient(140deg,#16a060,#0d9488);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;box-shadow:0 0 0 1px rgba(39,201,122,.3),0 8px 24px rgba(39,201,122,.25)}
    .login-logo-mark svg{width:30px;height:30px}
    .login-clinic{font-size:.85rem;font-weight:800;color:#fff}
    .login-subtitle{font-size:.7rem;color:var(--muted);margin-top:2px}
    .login-title{font-size:1.2rem;font-weight:800;color:#fff;margin-bottom:6px}
    .login-role{font-size:.78rem;color:var(--accent3);font-weight:600;margin-bottom:24px;display:flex;align-items:center;gap:6px}
    .login-role::before{content:'';width:18px;height:2px;background:var(--accent)}
    .btn-login{width:100%;justify-content:center;margin-top:8px;padding:13px}
    .login-footer{text-align:center;margin-top:20px;font-size:.75rem;color:rgba(255,255,255,.3)}
    .login-footer a{color:var(--accent3)}
    .error-msg{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.25);border-radius:10px;padding:10px 14px;font-size:.8rem;color:#fca5a5;margin-bottom:14px;display:none}
    .demo-hint{background:rgba(39,201,122,.07);border:1px solid rgba(39,201,122,.15);border-radius:10px;padding:10px 14px;font-size:.75rem;color:var(--muted);margin-bottom:18px;line-height:1.6}
  </style>
</head>
<body>
<div class="login-box">
  <div class="login-logo">
    <div class="login-logo-mark">
      <svg viewBox="0 0 32 32" fill="none" stroke="white" stroke-width="1.4">
        <rect x="11" y="9.5" width="10" height="14.5" rx="3" fill="rgba(255,255,255,.18)"/>
        <line x1="16" y1="13" x2="16" y2="17.5" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="13.8" y1="15.2" x2="18.2" y2="15.2" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="login-clinic">Sanjeevani Clinic</div>
    <div class="login-subtitle">Multispeciality Homeopathy · Jagtial</div>
  </div>

  <h1 class="login-title">Doctor Login</h1>
  <p class="login-role">Dr. T. Srinivas, MD (Homeopathy)</p>

  <div class="demo-hint">
    <strong>Demo credentials</strong><br>
    Email: <code>doctor@sanjeevani.clinic</code><br>
    Password: <code>Doctor@123</code>
  </div>

  <div class="error-msg" id="err"></div>

  <form id="loginForm">
    <div class="form-group">
      <label class="form-label">Email Address</label>
      <input class="form-control" type="email" id="email" placeholder="doctor@sanjeevani.clinic" autocomplete="username" required/>
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input class="form-control" type="password" id="password" placeholder="••••••••" autocomplete="current-password" required/>
    </div>
    <button type="submit" class="btn btn-primary btn-login" id="submitBtn">
      <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      Sign In
    </button>
  </form>

  <div class="login-footer">
    <a href="/index.html">← Back to website</a>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="../cms/js/config.js"></script>
<script src="../cms/js/api.js"></script>
<script>
const { gasGet, login, logout, showToast } = window.API_UTILS;
(async () => {
  try {
    const user = await gasGet('me');
    if (user && user.role === 'doctor') window.location.href = '/doctor/dashboard.html';
  } catch {}
})();

document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const err = document.getElementById('err');
  err.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const data = await login(document.getElementById('email').value.trim(), document.getElementById('password').value);
    if (data.role !== 'doctor') {
      err.textContent = 'This portal is for doctors only.';
      err.style.display = 'block';
      await logout();
    } else {
      window.location.href = '/doctor/dashboard.html';
    }
  } catch (ex) {
    err.textContent = ex.message || 'Login failed. Check your credentials.';
    err.style.display = 'block';
  } finally {
    btn.disabled = false; btn.innerHTML = '<svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg> Sign In';
  }
});
</script>
</body>
</html>
